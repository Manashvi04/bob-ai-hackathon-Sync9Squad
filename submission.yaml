submission:
  title: "PortFlowAI — Container Congestion Predictor & Port Operations Optimiser"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    "Major ports face severe vessel and container congestion because berth,
    crane, yard, and routing decisions are often made manually and congestion
    is detected only after queues have already formed. This results in vessel
    delays, poor resource utilisation, higher operating costs, and disruption
    across global supply chains."

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    "PortFlowAI is an AI-assisted port operations platform that predicts
    congestion hotspots using vessel schedules and port-capacity data,
    recommends alternate routing strategies, optimises berth and crane
    assignments, monitors yard utilisation, and generates a practical 72-hour
    operations plan for shift supervisors."

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Congestion hotspot prediction using vessel schedules, berth capacity, crane availability, and yard utilisation"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Optimised berth and crane assignment recommendations"
    - "Alternate routing and rescheduling recommendations for high-risk vessels"
    - "72-hour port operations plan for shift supervisors"                               # optional 4th
    - "Operations dashboard with vessel queue, resource utilisation, alerts, and recommended actions"                               # optional 5th

  tech_stack:
    languages: ["Python","TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI","React","Vite"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM BOB"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Pandas","NumPy", "Scikit-learn","Google OR-Tools","Recharts","GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    PortFlowAI goes beyond simply predicting port congestion. It connects
    congestion prediction with actionable berth and crane optimisation,
    alternate routing recommendations, operational alerts, and a 72-hour
    operations plan for shift supervisors. The solution follows a complete
    Predict → Explain → Recommend → Optimise → Plan workflow, helping port
    operators move from reactive congestion management to proactive
    decision-making.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The current hackathon implementation uses simulated or sample port
    operational data rather than live AIS, terminal operating system, or
    port community system feeds. Prediction quality therefore depends on
    the available sample data and assumptions. A production deployment
    would require integration with real-time vessel, berth, crane, yard,
    weather, and terminal data, along with port-specific operational and
    safety constraints.

